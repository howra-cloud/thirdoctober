<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101a35"><meta name="description" content="A little love note for Yakub, from Howra."><title>For Yakub, with love — Howra</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Allura&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Cormorant+Garamond:wght@400;500;600&display=swap");
*,:after,:before{box-sizing:border-box;border:0 solid;margin:0;padding:0}
html{line-height:1.5;font-family:ui-sans-serif,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background-color:oklch(20% .04 263);color:oklch(96% .014 84)}
button{font:inherit;color:inherit;background:transparent}
img{display:block;max-width:100%}
.love-note{position:relative;isolation:isolate;display:grid;min-height:100svh;place-items:center;overflow:hidden;padding:24px 20px 62px;color:#f7f4ee;background:radial-gradient(ellipse at 49% 42%,rgba(44,62,105,.52),transparent 47%),radial-gradient(ellipse at 90% 8%,rgba(39,56,96,.28),transparent 34%),linear-gradient(145deg,#172342,#101a35 46%,#0b142a)}
.love-note:before,.love-note:after{position:absolute;z-index:-1;inset:0;content:"";pointer-events:none}
.love-note:before{opacity:.17;background:repeating-linear-gradient(112deg,transparent 0 17px,rgba(205,216,238,.08) 18px,transparent 20px 42px);mask-image:radial-gradient(ellipse at center,black 5%,transparent 82%)}
.love-note:after{opacity:.28;background:radial-gradient(ellipse at center,transparent 46%,rgba(2,8,22,.46) 100%)}
.ambient{position:absolute;z-index:-1;width:min(76vw,760px);aspect-ratio:1;border:1px solid rgba(236,228,212,.045);border-radius:50%;pointer-events:none}
.ambient-one{transform:scaleY(.37) rotate(-12deg)}
.ambient-two{width:min(100vw,980px);transform:scaleY(.31) rotate(13deg)}
.envelope{position:relative;display:block;width:min(76vw,680px);aspect-ratio:1.62;padding:0;border:0;border-radius:3px;background:transparent;color:inherit;cursor:pointer;perspective:1400px;filter:drop-shadow(0 35px 46px rgba(1,6,18,.48))}
.envelope:focus-visible{outline:1px solid rgba(255,255,255,.8);outline-offset:15px}
.envelope-back{position:absolute;z-index:1;inset:0;overflow:hidden;border:1px solid rgba(121,111,97,.3);border-radius:3px;background:linear-gradient(115deg,#fffffff2,#efebe3f7 52%,#faf8f2f2),#f5f2eb;box-shadow:inset 0 1px #fffffff0,inset 0 -12px 26px #5f523e0e}
.envelope-back:after{position:absolute;inset:0;content:"";opacity:.16;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(122,108,87,.12) 4px,transparent 5px 9px);pointer-events:none}
.letter{position:absolute;z-index:2;left:8%;bottom:-28%;display:grid;width:84%;height:137%;overflow:hidden;padding:9% 5% 7%;color:#20202a;background:radial-gradient(ellipse at 18% 23%,rgba(255,255,255,.78),transparent 42%),repeating-linear-gradient(0deg,transparent 0 4px,rgba(133,112,86,.035) 5px,transparent 6px 10px),linear-gradient(115deg,#faf8f0,#f1ede3 58%,#fbf9f2);box-shadow:0 3px 18px #231c132b,inset 0 0 38px #7562460f;opacity:0;transform:translateY(3%) scale(.985);transition:transform 1.15s cubic-bezier(.18,.78,.2,1),opacity .55s ease;transition-delay:0s;pointer-events:none}
.letter-inner{display:flex;height:100%;flex-direction:column;align-items:center;text-align:center}
.letter-to{margin-bottom:5%;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(11px,1.5vw,17px);font-weight:500;letter-spacing:.22em}
.letter-title{font-family:"Bodoni Moda","Times New Roman",serif;font-size:clamp(30px,6vw,69px);font-weight:400;line-height:.88;letter-spacing:-.045em}
.letter-date{margin-top:5%;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(13px,1.8vw,20px);letter-spacing:.07em}
.letter-love{margin-top:auto;font-family:Allura,cursive;font-size:clamp(27px,4.3vw,49px);line-height:1}
.letter-xo{margin-top:2%;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(12px,1.7vw,18px);letter-spacing:.25em}
.envelope-fold,.envelope-pocket,.envelope-flap{position:absolute;inset:0;pointer-events:none}
.fold-left{z-index:3;clip-path:polygon(0 0,52% 58%,0 100%);background:linear-gradient(125deg,#fbfaf5,#e8e3d9 75%);filter:drop-shadow(1px 0 1px rgba(111,98,80,.17))}
.fold-right{z-index:3;clip-path:polygon(100% 0,48% 58%,100% 100%);background:linear-gradient(235deg,#faf9f4,#e8e3d9 78%);filter:drop-shadow(-1px 0 1px rgba(111,98,80,.17))}
.envelope-pocket{z-index:4;clip-path:polygon(0 100%,0 0,50% 61%,100% 0,100% 100%);border-radius:0 0 3px 3px;background:linear-gradient(165deg,#faf9f4,#f1eee7 52%,#e9e4da);box-shadow:inset 0 1px #ffffffd9}
.envelope-pocket:after{position:absolute;inset:0;content:"";background:linear-gradient(180deg,transparent 52%,rgba(133,119,96,.09))}
.envelope-flap{z-index:5;inset:0 0 auto;height:57%;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transform-style:preserve-3d;backface-visibility:hidden;background:linear-gradient(180deg,#fffefa,#ece8df 95%);filter:drop-shadow(0 2px 2px rgba(91,79,62,.16));transition:transform .85s cubic-bezier(.65,0,.35,1),opacity .25s ease;transition-delay:.12s,0s}
.open-prompt,.from-label{position:absolute;z-index:6;left:50%;transform:translate(-50%);white-space:nowrap;pointer-events:none}
.open-prompt{top:39%;color:#55504a;font-family:Allura,cursive;font-size:clamp(32px,5.5vw,58px);font-weight:400;line-height:1;transition:opacity .3s ease,transform .5s ease}
.click-prompt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#20202a;font-family:Allura,cursive;font-size:clamp(32px,5.5vw,58px);font-weight:400;line-height:1;opacity:0;pointer-events:none;white-space:nowrap}
@keyframes dissolve{0%{opacity:1;filter:blur(0)}to{opacity:0;filter:blur(6px)}}
@keyframes fadeInClick{0%{opacity:0}to{opacity:1}}
.from-label{bottom:8%;color:#625c54;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(10px,1.35vw,14px);letter-spacing:.25em;opacity:0;transition:opacity .5s ease .45s}
.hint{position:absolute;bottom:55px;margin:0;color:#f3eee39e;font-family:"Cormorant Garamond",Georgia,serif;font-size:14px;letter-spacing:.18em;text-align:center;transition:opacity .45s ease}
.envelope.is-open .envelope-flap{z-index:0;transform:rotateX(180deg);opacity:.72;transition-delay:0s,.28s}
.envelope.is-open .letter{opacity:1;transform:translateY(-48%) scale(1);transition-delay:.38s}
.envelope.is-open .open-prompt{opacity:0;transform:translate(-50%,9px)}
/* NEW: words dissolve 5s after the letter pops out, then "scroll down" appears */
.envelope.is-open .letter-inner{animation:dissolve .8s ease forwards;animation-delay:5s}
.envelope.is-open .click-prompt{animation:fadeInClick .8s ease forwards;animation-delay:5.2s}
.envelope.is-open .from-label{opacity:1}
.envelope.is-open~.hint{opacity:.8}
.envelope.is-unrolling .click-prompt{animation:none;opacity:0;transition:opacity .3s ease}
/* NEW: the letter that extends upward and unravels the photos */
.strip{position:absolute;z-index:2;left:8%;bottom:25%;width:84%;height:0;overflow:hidden;display:none;pointer-events:none;background:radial-gradient(ellipse at 18% 23%,rgba(255,255,255,.78),transparent 42%),repeating-linear-gradient(0deg,transparent 0 4px,rgba(133,112,86,.035) 5px,transparent 6px 10px),linear-gradient(115deg,#faf8f0,#f1ede3 58%,#fbf9f2);box-shadow:0 3px 18px #231c132b,inset 0 0 38px #7562460f}
.strip-col{position:absolute;left:0;bottom:0;width:100%;display:flex;flex-direction:column;gap:5%;padding:8% 8% 3%;transform:translateY(100%)}
.strip-col img{width:100%;aspect-ratio:3/4;object-fit:cover;box-shadow:0 2px 10px rgba(35,28,19,.28)}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:99;pointer-events:none}
.message-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:101;padding:20px 40px;background:#fff;color:#000;font-family:Allura,cursive;font-size:clamp(32px,5.5vw,58px);font-weight:400;line-height:1.1;border:0;border-radius:50px;box-shadow:0 10px 40px #0000004d;opacity:0;pointer-events:none;cursor:pointer}
.message-popup.show{animation:popupMessage .6s cubic-bezier(.34,1.56,.64,1) forwards;pointer-events:auto}
@keyframes popupMessage{0%{opacity:0;transform:translate(-50%,-50%) scale(0)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@media(max-width:600px){.love-note{padding:20px 14px 58px}.envelope{width:min(88vw,500px)}.letter{left:7%;width:86%;height:150%;padding:8% 4% 6%}.letter-title{font-size:clamp(31px,9vw,48px)}.letter-date{margin-top:6%}.envelope.is-open .letter{transform:translateY(-45%) scale(1)}.hint{bottom:45px;font-size:12px;letter-spacing:.12em}}
</style></head>

</button>
<p class="hint" aria-live="polite">A little something, just for you</p>
<canvas id="confetti" aria-hidden="true"></canvas>
<button class="message-popup" type="button">love you!</button>
</main>
<script>
const env=document.querySelector('.envelope'),hint=document.querySelector('.hint'),letter=document.querySelector('.letter'),
strip=document.querySelector('.strip'),col=document.querySelector('.strip-col'),pop=document.querySelector('.message-popup'),cv=document.getElementById('confetti');
let started=false,over=false,mx=-1,my=-1;
env.addEventListener('click',()=>{if(started)return;const o=env.classList.toggle('is-open');env.setAttribute('aria-expanded',String(o));
env.setAttribute('aria-label',o?'Close the letter from Howra':'Open the letter from Howra');hint.textContent=o?'With all my love, always':'A little something, just for you'});
function inLetter(x,y){const r=letter.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
function begin(){
  if(started||!env.classList.contains('is-open'))return;started=true;
  const e=env.getBoundingClientRect(),l=letter.getBoundingClientRect(),bottomY=e.bottom-.25*e.height,h0=bottomY-l.top,hF=bottomY;
  env.classList.add('is-unrolling');strip.style.display='block';strip.style.height=h0+'px';
  strip.animate([{height:h0+'px'},{height:hF+'px'}],{duration:2600,easing:'cubic-bezier(.65,0,.35,1)',fill:'forwards'}).onfinish=()=>{
    const dur=Math.max(8000,col.offsetHeight/.18); // slow, ~180px per second
    col.animate([{transform:'translateY(100%)'},{transform:'translateY(0)'}],{duration:dur,easing:'linear',fill:'forwards'}).onfinish=()=>setTimeout(finale,400);
  };
}
document.addEventListener('wheel',ev=>{if(!env.classList.contains('is-open'))return;if(started){ev.preventDefault();return}
  if(inLetter(ev.clientX,ev.clientY)){ev.preventDefault();begin()}},{passive:false});
let tStart=false;
document.addEventListener('touchstart',ev=>{const t=ev.touches[0];tStart=inLetter(t.clientX,t.clientY)},{passive:true});
document.addEventListener('touchmove',ev=>{if(started||tStart){if(env.classList.contains('is-open'))ev.preventDefault();if(tStart)begin()}},{passive:false});
function finale(){
  const e=env.getBoundingClientRect(),W=cv.width=innerWidth,H=cv.height=innerHeight,ctx=cv.getContext('2d');
  const cols=['#f7d774','#ffed4e','#f4a6b8','#ffffff','#a8c5ff','#e8b4f0','#ffcf99'],P=[];
  function burst(n){for(let i=0;i<n;i++){const d=(Math.random()-.5)*.6,x=e.left+e.width*(.5+d),y=e.top+e.height*.61*(1-Math.abs(d)/.5),a=-Math.PI/2+(Math.random()-.5)*1.5,s=9+Math.random()*13;
    P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length]})}}
  burst(120);setTimeout(()=>burst(90),350);setTimeout(()=>burst(70),800);
  setTimeout(()=>pop.classList.add('show'),700);
  (function tick(){ctx.clearRect(0,0,W,H);let alive=0;
    for(const p of P){p.vy+=.34;p.vx*=.99;p.vy*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y<H+30){alive++;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}}
    if(alive||P.length<260)requestAnimationFrame(tick);else ctx.clearRect(0,0,W,H)})();
}
</script></body></html>
